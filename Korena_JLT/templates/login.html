{% extends 'base.html' %}{% block title %}Sign in{% endblock %}{% block content %}
<section class="auth-card">
  <span class="auth-emblem">✚</span>
  <div class="eyebrow">ACCOUNTING MADE SIMPLE</div>
  <h1>Welcome to Korena</h1>
  <p class="muted">Korena Journal, General Ledger and Trial Balance System.</p>
  <form class="auth-form" method="post" action="{{url_for('do_login')}}">
    <input type="hidden" name="_csrf" value="{{csrf}}">
    <label>Email address <input type="email" name="email" autocomplete="username" placeholder="admin@korena.local"
        required autofocus></label>
    <label>Password <input type="password" name="password" autocomplete="current-password"
        placeholder="Your administrator password" required></label>
    <button class="btn primary wide" type="submit">Sign in →</button>
  </form>
  <p class="auth-bottom">Local classroom project · Data stored in your MySQL database</p>
</section>
{% endblock %}
